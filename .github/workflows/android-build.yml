
name: LuxeCalc APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        run: |
          set -e
          echo "Checking project ZIP..."
          ls -lah *.zip
          ZIP_FILE="LuxeCalc-Android-Project-Updated.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Updated project ZIP not found"
            exit 1
          fi
          mkdir -p app-source launcher-icons
          unzip -t "$ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d app-source
          echo "Project extracted successfully"
          unzip -t LuxeCalc-Launcher-Icon-Pack.zip
          unzip -oq LuxeCalc-Launcher-Icon-Pack.zip -d launcher-icons
          echo "Icon pack extracted successfully"
          find app-source -name AndroidManifest.xml
          find launcher-icons -type d -name res

          ZIP_FILE="LuxeCalc-Android-Project-Updated.zip"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source
          unzip -oq LuxeCalc-Launcher-Icon-Pack.zip -d launcher-icons
          mkdir -p app-source/app/src/main/res
          cp -R launcher-icons/LuxeCalc-Launcher-Icon-Pack/res/. app-source/app/src/main/res/
          test -f app-source/settings.gradle.kts


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: app-source
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxeCalc-Android-APK
          path: app-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

