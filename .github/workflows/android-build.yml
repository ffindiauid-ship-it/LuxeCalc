
name: LuxeCalc APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LuxeCalc Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Check and extract Android project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -lah

          ZIP_FILE="1LuxeCalc-Android-Project-Updated.zip..zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip"
            exit 1
          fi

          echo "Checking ZIP file:"
          file "$ZIP_FILE"
          unzip -t "$ZIP_FILE"

          mkdir -p app-source
          unzip -oq "$ZIP_FILE" -d app-source

          echo "Project extracted successfully."
          find app-source -maxdepth 4 -type f | head -80

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find app-source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find app-source -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project folder: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found in project folder."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found."
            exit 1
          fi

      - name: Extract and install LuxeCalc launcher icons
        shell: bash
        run: |
          set -e

          ICON_ZIP="LuxeCalc-Launcher-Icon-Pack.zip"

          if [ ! -f "$ICON_ZIP" ]; then
            echo "ERROR: Icon ZIP not found: $ICON_ZIP"
            exit 1
          fi

          mkdir -p launcher-icons
          unzip -t "$ICON_ZIP"
          unzip -oq "$ICON_ZIP" -d launcher-icons

          ICON_RES=$(find launcher-icons -type d -name res | head -n 1)

          if [ -z "$ICON_RES" ]; then
            echo "ERROR: Icon res folder not found."
            find launcher-icons -maxdepth 5 -type f
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/app/src/main/res"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            SOURCE="$ICON_RES/mipmap-$density"
            DEST="$PROJECT_DIR/app/src/main/res/mipmap-$density"

            if [ ! -d "$SOURCE" ]; then
              echo "ERROR: Missing icon folder: $SOURCE"
              exit 1
            fi

            mkdir -p "$DEST"

            for icon in ic_launcher.png ic_launcher_round.png; do
              if [ ! -f "$SOURCE/$icon" ]; then
                echo "ERROR: Missing $icon in $SOURCE"
                exit 1
              fi

              cp -f "$SOURCE/$icon" "$DEST/$icon"
            done
          done

          echo "Launcher icons installed."

      - name: Check launcher icon configuration
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Android manifest found."
          grep -n "android:icon" "$MANIFEST" || true

          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            echo "WARNING: Manifest does not use @mipmap/ic_launcher."
            echo "Check the application icon setting in AndroidManifest.xml."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build LuxeCalc APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload LuxeCalc APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxeCalc-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
